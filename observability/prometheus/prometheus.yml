global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [spring:8080]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: elasticsearch
    static_configs:
      - targets: [elasticsearch-exporter:9114]
