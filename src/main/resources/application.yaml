spring:
  application:
    name: gangwon-companion
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

search:
  engine: ${SEARCH_ENGINE:rdb}
  embedding:
    enabled: ${SEARCH_EMBEDDING_ENABLED:false}
    url: ${SEARCH_EMBEDDING_URL:http://localhost:8091}
    model: ${SEARCH_EMBEDDING_MODEL:intfloat/multilingual-e5-small}
    revision: ${SEARCH_EMBEDDING_REVISION:614241f622f53c4eeff9890bdc4f31cfecc418b3}
    dimensions: ${SEARCH_EMBEDDING_DIMENSIONS:384}
    timeout: ${SEARCH_EMBEDDING_TIMEOUT:2s}
    rank-window: ${SEARCH_EMBEDDING_RANK_WINDOW:50}
    rank-constant: ${SEARCH_EMBEDDING_RANK_CONSTANT:60}
  indexer:
    enabled: ${SEARCH_INDEXER_ENABLED:false}
    group-id: ${SEARCH_INDEXER_GROUP_ID:gangwon-search-indexer}
    topics: ${SEARCH_INDEXER_TOPICS:gangwon.public.destinations,gangwon.public.destination_details,gangwon.public.pet_infos,gangwon.public.accessibility_infos,gangwon.public.restaurants,gangwon.public.lodgings}
    retry-attempts: ${SEARCH_INDEXER_RETRY_ATTEMPTS:7}
    dlt-recovery-interval: ${SEARCH_INDEXER_DLT_RECOVERY_INTERVAL:30000}
  recommendation:
    jobs:
      retention: ${COURSE_RECOMMENDATION_JOB_RETENTION:24h}
      cleanup-interval: ${COURSE_RECOMMENDATION_JOB_CLEANUP_INTERVAL:3600000}
  elasticsearch:
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    api-key: ${ELASTICSEARCH_API_KEY:}
    alias: gangwon-places
    index-prefix: gangwon-places-v1
    connect-timeout: 2s
    request-timeout: ${ELASTICSEARCH_REQUEST_TIMEOUT:3s}
    bulk-size: 500
    reindex-key: ${ELASTICSEARCH_REINDEX_KEY:}

jwt:
  secret: ${JWT_SECRET}

personal-data:
  encryption-key: ${PERSONAL_DATA_ENCRYPTION_KEY}

captcha:
  enabled: ${CAPTCHA_ENABLED:false}
  secret: ${CAPTCHA_SECRET:}
  min-score: ${CAPTCHA_MIN_SCORE:0.5}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}

tour-api:
  service-key: ${TOUR_API_KEY}
  base-url: https://apis.data.go.kr

external:
  tour-api:
    service-key: ${TOUR_API_KEY}
    base-url: https://apis.data.go.kr/B551011/KorService2
  tats-cnctr-rate:
    service-key: ${TOUR_API_KEY}
    base-url: https://apis.data.go.kr/B551011/TatsCnctrRateService

ai:
  base-url: ${AI_SERVER_URL:http://localhost:8000}
  connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
  read-timeout: ${AI_READ_TIMEOUT:30s}
  internal-api-key: ${AI_INTERNAL_API_KEY:}

travel-profile:
  analysis:
    current-version: ${TRAVEL_PROFILE_ANALYSIS_VERSION:travel-profile-llm-v1}
    completed-ttl: ${TRAVEL_PROFILE_COMPLETED_TTL:7d}
    jobs:
      retention: ${TRAVEL_PROFILE_ANALYSIS_JOB_RETENTION:24h}
      cleanup-interval: ${TRAVEL_PROFILE_ANALYSIS_JOB_CLEANUP_INTERVAL:3600000}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        search.indexer.processing: true
        search.indexer.end.to.end: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
        search.indexer.processing: 100ms,500ms,1s,5s
        search.indexer.end.to.end: 1s,5s,10s,30s,1m,5m
