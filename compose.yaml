services:
  spring:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_gangwon
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-gangwon}
      POSTGRES_USER: ${POSTGRES_USER:-gangwon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwer1234}
      JWT_SECRET: ${JWT_SECRET:-gangwon_docker_jwt_secret_key_2024_very_long_string}
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:-gangwon_companion_aes_key_32byte}
      TOUR_API_KEY: ${TOUR_API_KEY:-}
      TATS_CNCTR_RATE_KEY: ${TATS_CNCTR_RATE_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SEARCH_ENGINE: ${SEARCH_ENGINE:-rdb}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_REINDEX_KEY: ${ELASTICSEARCH_REINDEX_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - networks_gangwon

  postgres:
    image: postgres:16-alpine
    container_name: postgres_gangwon
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gangwon}
      POSTGRES_USER: ${POSTGRES_USER:-gangwon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwer1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - networks_gangwon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gangwon_user} -d $${POSTGRES_DB:-gangwon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    container_name: elasticsearch_gangwon
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - networks_gangwon
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  networks_gangwon:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
